# Simple AMM liquidity-provider simulation preset.
# Models a balanced LP that posts adaptive quotes around ETH/USDC.

pair: "ETH/USDC"
strategy: "adaptive"
spread: 0.25
vol_window: 24
simulate: true

agent:
  initial_base: 15
  initial_quote: 30000
  base_spread_bps: 25
  max_order_size_pct: 0.05
  max_exposure: 60000
  max_inventory_pct: 0.50
  max_base_position: 20
  geography: "default"
  liquid_volume_threshold: 1000000

backtest:
  fill_probability: 0.50
  ticks: 1000
  base_price: 3000.0
  volatility: 0.02
